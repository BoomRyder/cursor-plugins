name: Sync document

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy upstream files
        run: |
          set -euo pipefail
          plugin="plugins/document"
          names=(docx pdf pptx xlsx)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 --branch main https://github.com/anthropics/skills.git "$tmp/src"
          sha=$(git -C "$tmp/src" rev-parse HEAD)
          test -n "$sha"
          rm -rf "$plugin/skills" "$plugin/LICENSE" "$plugin/THIRD_PARTY_NOTICES.md"
          mkdir -p "$plugin/skills"
          for name in "${names[@]}"; do
            cp -a "$tmp/src/skills/$name" "$plugin/skills/$name"
            test -f "$plugin/skills/$name/SKILL.md"
            grep -q "Apache License" "$plugin/skills/$name/LICENSE.txt"
          done
          cp -a "$tmp/src/skills/docx/LICENSE.txt" "$plugin/LICENSE"
          cp -a "$tmp/src/THIRD_PARTY_NOTICES.md" "$plugin/THIRD_PARTY_NOTICES.md"
          mapfile -t skill_dirs < <(find "$plugin/skills" -mindepth 1 -maxdepth 1 -type d)
          test "${#skill_dirs[@]}" -eq 4
          python - "$plugin/UPSTREAM.json" "$sha" <<'PY'
          import json, pathlib, sys
          record_path, sha = sys.argv[1:]
          pathlib.Path(record_path).write_text(json.dumps({
              "repository": "https://github.com/anthropics/skills",
              "commit": sha,
              "ref": "main",
              "version": "1.0.0",
              "license": "Apache-2.0",
              "paths": ["skills/docx", "skills/pdf", "skills/pptx", "skills/xlsx", "THIRD_PARTY_NOTICES.md", "LICENSE"],
          }, indent=2) + "\n", encoding="utf-8", newline="\n")
          print(f"synced document ({sha})")
          PY

      - name: Open a pull request when upstream moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "document is already at upstream"
            exit 0
          fi
          sha=$(python -c "import json; print(json.load(open('plugins/document/UPSTREAM.json'))['commit'][:12])")
          branch="sync/document-$sha"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "branch $branch already exists"
            exit 0
          fi
          git checkout -b "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync document from upstream."
          git push --set-upstream origin "$branch"
          gh pr create --title "Sync document from upstream" --body "Updates the vendored docx, pdf, pptx, and xlsx skills to anthropics/skills@${sha}. The skill files and Apache license stay upstream's. Review the diff, then merge."
